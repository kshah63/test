# One-click deploy on Render (https://render.com):
#   Dashboard -> New -> Blueprint -> connect this repo -> Apply.
# Provisions the web service and a free Postgres database, generates
# NEXTAUTH_SECRET, and enables demo billing so subscriptions can be tested
# without Stripe keys. Add Stripe env vars later for real payments.
services:
  - type: web
    name: tinysteps
    runtime: node
    plan: free
    # --include=dev: Render sets NODE_ENV=production, which would otherwise
    # skip the devDependencies the build needs (prisma, tsx, typescript, tailwind).
    buildCommand: npm ci --include=dev && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tinysteps-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: ALLOW_DEMO_BILLING
        value: "true"

databases:
  - name: tinysteps-db
    plan: free
    databaseName: tinysteps
    user: tinysteps
